<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My personal introduction website</title>
    <style type ="text/css">
        *{
            text-decoration: none;
            margin: 0;
            padding: 0;
        }
        body{
            background-image: url('img/Nia.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }
        .navbar{
            background-color: rgba(186, 165, 255, 0.7); 
            font-family: calibri; 
            padding-right: 15px;
            padding-left: 15px;
        }
        .navdiv{
            height: 100px;
            display: flex; 
            align-items: center; 
            justify-content: space-between;
        }
        .logo a{
            font-size: 50px; 
            font-weight: 600; 
            color: white;
        }
        li{
            list-style: none; 
            display: inline-block;
        }
        li a{
            color: white; 
            font-size: 30px; 
            font-weight: bold; 
            margin-right: 25px;
        }
        button{
            background-color: #ffa3a3; 
            margin-left: 10px; 
            border-radius: 10px; 
            padding: 10px; 
            width: 90px;
            font-size: 20px;
            color: white;
        }
        button a{
            color: white; 
            font-weight: bold; 
            font-size: 15px;
        }





    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navdiv">
            <div class ="logo"><a href="#">Personal Introduction</a> </div>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
                <button><a href="SignIn"></a>In</button>
                <button><a href="SignUp"></a>Out</button>
            </ul>
        </div>
    </nav>
</body>
</html>
