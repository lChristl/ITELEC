<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My personal introduction website</title>
    <style type ="text/css">
        *{
            text-decoration: none;
            margin: 0;
            padding: 0;
        }
        body{
            background-image: url('img/Nia.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-attachment: fixed;
        }
        .navbar{
            background-color: rgba(186, 165, 255, 0.7); 
            font-family: 'Times New Roman', Times, serif; 
            padding-right: 15px;
            padding-left: 15px;
        }
        .navdiv{
            height: 120px;
            display: flex; 
            align-items: center; 
            justify-content: space-between;
        }
        .logo a{
            font-size: 50px; 
            font-weight: 600; 
            color: white;
        }
        li{
            list-style: none; 
            display: inline-block;
        }
        li a{
            color: white; 
            font-size: 30px; 
            font-weight: bold; 
            margin-right: 25px;
        }
        button{
            background-color: #ffa3a3; 
            margin-left: 10px; 
            border-radius: 10px; 
            padding: 10px; 
            width: 90px;
            font-size: 20px;
            color: white;
        }
        button a{
            color: white; 
            font-weight: bold; 
            font-size: 15px;
        }
        .main{
            color: #ffffff;
            font-style: calibri;
            font-size: 100px;
        }
        .main{
            background-color: rgb(10, 3, 34, 90%);
            padding: 50px;
            margin-left: 500px;
            margin-right: 500px;
            margin-top: 100px;
            border-radius: 50px;
            justify-content: space-between;
            /* align-items: center; */
            display: flex;
        }
        .portrait-frame{
            width: 100%;
            height: auto;
            border-radius: 50px;   
        }  
        .portrait-frame img{
            width: 800px;
            height: auto;
            display: block;
            
        }
         
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navdiv">
            <div class ="logo"><a href="#">Personal Introduction</a> </div>
            <ul>
                <li><a href="#">About Me</a></li>
                <li><a href="#">Educational Background</a></li>
                <li><a href="#">Hobbies</a></li>
                <button><a href="SignIn"></a>In</button>
                <button><a href="SignUp"></a>Out</button>
            </ul>
        </div>
    </nav>

    <section class ="main">
        <div class ="container">
            <p>Hi, I am Christian. This website is made to give an idea about myself.</p>
        </div>
        <figure class="portrait-frame">
            <img src="img/portrait.jpg" alt="Display photo of Christian">
        </figure>
        </div>
    </section>
        



    </div>
</body>
</html>
